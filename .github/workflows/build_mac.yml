name: Build macOS Agent Binary

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller opencv-python requests pygame

      - name: Build macOS Executable
        run: |
          pyinstaller --onefile --name "AssetGuard_Setup_Mac" scout.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetGuard_Setup_Mac
          path: dist/AssetGuard_Setup_Mac
